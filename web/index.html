<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShelfCart</title>
<style>
  :root { --ink:#16181d; --mute:#667085; --line:#e4e7ec; --bg:#f6f5f1; --card:#fff; --go:#0a7d4f; --go-bg:#e6f5ee; --warn:#b25e09; --warn-bg:#fdf1e0; --no:#8a8f98; --no-bg:#eef0f2; --accent:#2b3bd6; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 -apple-system, "Segoe UI", Inter, sans-serif; color:var(--ink); background:var(--bg); }
  main { max-width:1040px; margin:0 auto; padding:20px 16px 80px; }
  h1 { font-size:26px; margin:0; letter-spacing:-.02em; }
  h2 { font-size:17px; margin:28px 0 10px; }
  .sub { color:var(--mute); margin:4px 0 18px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
  .capture { display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:14px; }
  @media (max-width:720px){ .capture{ grid-template-columns:1fr; } }
  video#cam { width:100%; aspect-ratio:16/10; background:#111; border-radius:10px; object-fit:cover; display:block; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button, .btn { font:inherit; font-weight:600; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:10px; padding:9px 14px; cursor:pointer; text-decoration:none; display:inline-block; }
  button.primary, .btn.primary { background:var(--ink); color:#fff; border-color:var(--ink); }
  button.go { background:var(--go); color:#fff; border-color:var(--go); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .hint { color:var(--mute); font-size:13px; }
  #frames { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  #frames img { height:64px; border-radius:6px; border:1px solid var(--line); }
  #status { margin:14px 0 0; font-weight:600; min-height:22px; }
  .bar { height:4px; background:var(--line); border-radius:4px; overflow:hidden; margin-top:8px; display:none; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); }
  .item { display:grid; grid-template-columns:150px minmax(0,1fr); gap:14px; margin-bottom:12px; }
  @media (max-width:720px){ .item{ grid-template-columns:96px minmax(0,1fr); } }
  .item .crop { width:100%; aspect-ratio:1; object-fit:contain; background:#f1f1ee; border-radius:10px; }
  .item h3 { margin:0 0 2px; font-size:16px; }
  .badge { display:inline-block; font-size:12px; font-weight:700; border-radius:999px; padding:2px 9px; margin-right:6px; }
  .badge.auto { background:var(--go-bg); color:var(--go); } .badge.confirm { background:var(--warn-bg); color:var(--warn); } .badge.none { background:var(--no-bg); color:var(--no); }
  .meta { color:var(--mute); font-size:12.5px; margin:4px 0 8px; }
  .cands { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
  .cand { flex:0 0 150px; width:150px; min-width:0; overflow:hidden; border:2px solid var(--line); border-radius:10px; padding:8px; cursor:pointer; background:#fff; font-size:12.5px; position:relative; }
  .cand.sel { border-color:var(--go); background:var(--go-bg); }
  .cand.suggest { border-color:var(--warn); border-style:dashed; }
  .cand img { width:100%; aspect-ratio:1; object-fit:contain; background:#fff; border-radius:6px; }
  .cand .t { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:36px; margin-top:4px; }
  .cand .p { font-weight:700; font-size:14px; }
  .cand .s { color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cand a { color:var(--accent); font-size:12px; }
  .sticky { position:sticky; bottom:0; background:linear-gradient(transparent, var(--bg) 30%); padding:18px 0 10px; display:none; }
  .cart { margin-bottom:12px; }
  .cart h3 { margin:0 0 8px; font-size:16px; }
  .line { display:flex; gap:10px; align-items:center; padding:6px 0; border-top:1px solid var(--line); }
  .line img { width:44px; height:44px; object-fit:contain; border-radius:6px; background:#fff; }
  .line .grow { flex:1; min-width:0; }
  .tot { text-align:right; font-weight:700; margin:8px 0; }
  .safe { background:var(--go-bg); color:var(--go); border-radius:10px; padding:10px 12px; font-size:13.5px; margin-bottom:12px; }
  .err { color:#b42318; }
  code { font-size:12px; background:#f1f1ee; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<main>
  <h1>ShelfCart</h1>
  <p class="sub">Pan a camera across a shelf, a desk or the inside of a bag. Get a real Shopify cart of what it saw.</p>

  <div class="panel capture">
    <div>
      <video id="cam" autoplay playsinline muted></video>
    </div>
    <div>
      <div class="row">
        <button id="btnCam">Start camera</button>
        <button id="btnScan" class="primary" disabled>Scan for 4 seconds</button>
      </div>
      <p class="hint">Move slowly across the items while it scans. Labels facing the camera work best.</p>
      <div class="row" style="margin-top:14px">
        <label class="btn">Upload video or photos<input id="file" type="file" accept="image/*,video/*" multiple hidden></label>
      </div>
      <p class="hint">A video is sampled into 5 frames in your browser. Up to 5 photos.</p>
      <div id="frames"></div>
    </div>
  </div>
  <div id="status"></div>
  <div class="bar" id="bar"><i></i></div>

  <div id="results"></div>
  <div class="sticky" id="sticky">
    <div class="panel row" style="justify-content:space-between">
      <div><b id="selCount">0 items</b> <span class="hint" id="selSum"></span></div>
      <button class="go" id="btnCart">Build Shopify cart</button>
    </div>
  </div>
  <div id="carts"></div>
</main>

<script>
const $ = s => document.querySelector(s);
const cam = $('#cam'), statusEl = $('#status'), bar = $('#bar'), barI = $('#bar i');
let products = [], stream = null;
const money = (cents, cur='USD') => cents == null ? '' : new Intl.NumberFormat('en-US', {style:'currency', currency:cur}).format(cents / 100);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function setStatus(t, isErr) { statusEl.textContent = t; statusEl.className = isErr ? 'err' : ''; }
function progress(on) { bar.style.display = on ? 'block' : 'none'; if (on) { barI.style.transition='none'; barI.style.width='0'; requestAnimationFrame(() => { barI.style.transition='width 14s cubic-bezier(.1,.6,.3,1)'; barI.style.width='92%'; }); } }

// ---------- capture ----------
function grab(source, w, h) {
  const scale = Math.min(1, 1280 / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * scale); c.height = Math.round(h * scale);
  c.getContext('2d').drawImage(source, 0, 0, c.width, c.height);
  return c;
}
function sharpness(canvas) { // mean absolute horizontal gradient on a small gray copy: higher = less motion blur
  const s = document.createElement('canvas'); s.width = 160; s.height = Math.round(160 * canvas.height / canvas.width);
  const g = s.getContext('2d'); g.drawImage(canvas, 0, 0, s.width, s.height);
  const d = g.getImageData(0, 0, s.width, s.height).data; let sum = 0;
  for (let i = 4; i < d.length; i += 4) sum += Math.abs((d[i] + d[i+1] + d[i+2]) - (d[i-4] + d[i-3] + d[i-2]));
  return sum / (d.length / 4);
}
function pickFrames(shots, n) { // shots: [{canvas, score}] in time order; keep the sharpest from each of n time buckets
  if (shots.length <= n) return shots.map(s => s.canvas);
  const out = [];
  for (let b = 0; b < n; b++) {
    const part = shots.slice(Math.floor(b * shots.length / n), Math.floor((b + 1) * shots.length / n));
    out.push(part.reduce((a, x) => x.score > a.score ? x : a).canvas);
  }
  return out;
}
const toUrl = c => c.toDataURL('image/jpeg', 0.85);

$('#btnCam').onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    cam.srcObject = stream; $('#btnScan').disabled = false; setStatus('Camera on. Point it at the items and press Scan.');
  } catch (e) { setStatus('Camera not available (' + e.message + '). Upload a video or photos instead.', true); }
};

$('#btnScan').onclick = async () => {
  $('#btnScan').disabled = true;
  const shots = [], t0 = performance.now(), DUR = 4000;
  while (performance.now() - t0 < DUR) {
    const c = grab(cam, cam.videoWidth, cam.videoHeight); shots.push({ canvas: c, score: sharpness(c) });
    setStatus('Scanning... ' + Math.ceil((DUR - (performance.now() - t0)) / 1000) + 's. Keep moving slowly.');
    await new Promise(r => setTimeout(r, 250));
  }
  $('#btnScan').disabled = false;
  run(pickFrames(shots, 5).map(toUrl));
};

function loadImage(file) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(grab(im, im.naturalWidth, im.naturalHeight)); im.onerror = rej; im.src = URL.createObjectURL(file); });
}
async function sampleVideo(file, n = 5) {
  const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = URL.createObjectURL(file);
  await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = () => rej(new Error('cannot decode this video')); });
  let dur = v.duration;
  if (!isFinite(dur)) { // MediaRecorder webm has no duration until you seek past the end
    v.currentTime = 1e7; await new Promise(r => v.onseeked = r); dur = v.currentTime;
  }
  const shots = [], steps = Math.min(15, Math.max(n, Math.floor(dur * 3)));
  for (let i = 0; i < steps; i++) {
    v.currentTime = dur * (i + 0.5) / steps;
    await new Promise(r => v.onseeked = r);
    const c = grab(v, v.videoWidth, v.videoHeight); shots.push({ canvas: c, score: sharpness(c) });
  }
  return pickFrames(shots, n);
}
$('#file').onchange = async e => {
  const files = [...e.target.files]; if (!files.length) return;
  try {
    setStatus('Reading media...');
    const vid = files.find(f => f.type.startsWith('video/'));
    const canvases = vid ? await sampleVideo(vid) : await Promise.all(files.filter(f => f.type.startsWith('image/')).slice(0, 5).map(loadImage));
    run(canvases.map(toUrl));
  } catch (err) { setStatus('Could not read that file: ' + err.message, true); }
  e.target.value = '';
};

// ---------- pipeline ----------
async function run(frames) {
  $('#frames').innerHTML = frames.map(f => `<img src="${f}">`).join('');
  $('#results').innerHTML = ''; $('#carts').innerHTML = ''; $('#sticky').style.display = 'none';
  setStatus(`Gemini 4 Hydrogen is reading ${frames.length} frame${frames.length > 1 ? 's' : ''}, then searching Shopify...`); progress(true);
  try {
    const r = await fetch('/api/scan', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ frames }) });
    if (!r.ok) throw new Error('server said ' + r.status);
    const j = await r.json();
    products = j.products.map(p => ({ ...p, sel: p.status === 'auto' ? p.pick : null }));
    const t = j.timing;
    setStatus(products.length ? `Found ${products.length} products in ${(t.total_ms / 1000).toFixed(1)}s (see ${(t.detect_ms / 1000).toFixed(1)}s, search + match ${(t.match_ms / 1000).toFixed(1)}s).` : 'No products recognized. Try again closer, with labels facing the camera.');
    render();
  } catch (e) { setStatus('Scan failed: ' + e.message, true); }
  progress(false);
}

const BADGE = { auto: ['auto', 'Matched'], confirm: ['confirm', 'Needs your OK'], none: ['none', 'No sure match'] };
function render() {
  $('#results').innerHTML = products.length ? '<h2>What it saw</h2>' + products.map((p, i) => {
    const [cls, txt] = BADGE[p.status];
    const why = p.status === 'confirm' ? 'Decision 1 is not sure this is the same product. Tap a listing to add it.' :
                p.status === 'none' ? (p.candidates.length ? 'None of these looked like the same product. Tap one if it is right.' : 'Nothing found in the Shopify catalog' + (p.error ? ' (' + esc(p.error) + ')' : '') + '.') :
                (p.consolidated ? 'Switched to a merchant already in your cart (equally good match).' : '');
    return `<div class="panel item">
      <img class="crop" src="${p.crop}">
      <div>
        <h3>${esc(p.label)}</h3>
        <div class="meta"><span class="badge ${cls}">${txt}</span>seen ${Math.round(p.confidence * 100)}%${p.legible != null ? ' · label readable ' + Math.round(p.legible * 100) + '%' : ''}${p.pick != null ? ' · match ' + Math.round(p.match_confidence * 100) + '%' : ''} ${why ? '· ' + why : ''}</div>
        <div class="cands">${p.candidates.map((c, k) => `
          <div class="cand ${p.sel === k ? 'sel' : (p.pick === k ? 'suggest' : '')}" data-i="${i}" data-k="${k}">
            <img src="${esc(c.image)}${c.image.includes('?') ? '&' : '?'}width=300" referrerpolicy="no-referrer">
            <div class="t">${esc(c.title)}</div>
            <div class="p">${money(c.price, c.currency)}</div>
            <div class="s">${esc(c.seller)}</div>
            <div class="s">same product: ${c.same != null ? Math.round(c.same * 100) + '%' : '?'} · <a href="${esc(c.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">listing</a></div>
          </div>`).join('')}</div>
      </div></div>`;
  }).join('') : '';
  document.querySelectorAll('.cand').forEach(el => el.onclick = () => {
    const p = products[+el.dataset.i], k = +el.dataset.k; p.sel = p.sel === k ? null : k; render();
  });
  const chosen = products.filter(p => p.sel != null).map(p => p.candidates[p.sel]);
  $('#sticky').style.display = products.length ? 'block' : 'none';
  $('#selCount').textContent = chosen.length + (chosen.length === 1 ? ' item' : ' items');
  $('#selSum').textContent = chosen.length ? `${money(chosen.reduce((a, c) => a + c.price, 0))} before shipping and tax · ${new Set(chosen.map(c => c.shop)).size} merchant(s)` : 'Tap listings to select them';
  $('#btnCart').disabled = !chosen.length;
}

$('#btnCart').onclick = async () => {
  const chosen = products.filter(p => p.sel != null).map(p => p.candidates[p.sel]);
  const titles = Object.fromEntries(chosen.map(c => [c.variant_id, c]));
  $('#btnCart').disabled = true; setStatus('Creating carts on Shopify...');
  try {
    const r = await fetch('/api/cart', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ lines: chosen.map(c => ({ shop: c.shop, variant_id: c.variant_id, quantity: 1 })) }) });
    const j = await r.json();
    setStatus(`Built ${j.carts.filter(c => !c.error).length} real Shopify cart(s) in ${(j.ms / 1000).toFixed(1)}s. Nothing has been bought.`);
    $('#carts').innerHTML = '<h2>Your carts</h2><div class="safe">These are real carts on each merchant\'s Shopify store. ShelfCart never pays: you review and pay on the merchant\'s own page. Shopify needs one cart per merchant.</div>' +
      j.carts.map((c, n) => c.error ? `<div class="panel cart"><h3>${esc(c.shop)}</h3><div class="err">Could not create this cart: ${esc(c.error)}</div></div>` : `
      <div class="panel cart">
        <h3>${esc((titles[c.lines[0]?.variant_id] || {}).seller || c.shop)} <span class="hint">${esc(c.shop)}</span></h3>
        ${c.lines.map(l => `<div class="line"><img src="${esc(l.image || '')}"><div class="grow">${esc((titles[l.variant_id] || {}).title || l.title)}<div class="hint">${esc(l.title || '')} · qty ${l.quantity}</div></div><b>${money(l.price, c.currency)}</b></div>`).join('')}
        ${c.discounts.length ? `<div class="hint">Discount applied by merchant: ${esc(c.discounts.join(', '))}</div>` : ''}
        <div class="tot">${c.totals.filter(t => t.type === 'total').map(t => 'Estimated total ' + money(t.amount, c.currency)).join('')}</div>
        <div class="row">
          <a class="btn primary" href="${esc(c.continue_url)}" target="_blank" rel="noopener">Open cart at merchant</a>
          <button data-n="${n}" class="co">Prepare checkout (tax + review page)</button>
          <span class="hint" id="co${n}"></span>
        </div>
      </div>`).join('');
    document.querySelectorAll('.co').forEach(b => b.onclick = async () => {
      const c = j.carts[+b.dataset.n], out = $('#co' + b.dataset.n); b.disabled = true; out.textContent = 'Asking Shopify...';
      try {
        const r2 = await fetch('/api/checkout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ shop: c.shop, cart_id: c.id }) });
        if (!r2.ok) throw new Error((await r2.json()).detail || r2.status);
        const k = await r2.json(), tot = k.totals.find(t => t.type === 'total'), tax = k.totals.find(t => t.type === 'tax');
        out.innerHTML = `${tot ? 'Total ' + money(tot.amount, k.currency) : ''}${tax ? ' incl. ' + money(tax.amount, k.currency) + ' tax' : ''} · <a href="${esc(k.continue_url)}" target="_blank" rel="noopener"><b>Review and pay on Shop</b></a> (you enter address and payment there)`;
      } catch (e) { out.textContent = 'Checkout not available: ' + e.message; b.disabled = false; }
    });
    $('#carts').scrollIntoView({ behavior: 'smooth' });
  } catch (e) { setStatus('Cart failed: ' + e.message, true); }
  $('#btnCart').disabled = false;
};
</script>
</body>
</html>
